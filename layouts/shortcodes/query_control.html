<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
  <link href="https://unpkg.com/@triply/yasgui/build/yasgui.min.css" rel="stylesheet" type="text/css"/>
  <script src="https://unpkg.com/@triply/yasgui/build/yasgui.min.js"></script>
  <script>
    let yasgui;
    let yasgui_options;

    $(document).ready(function () {
      yasgui_options = {
        requestConfig: {endpoint: ""},
        copyEndpointOnNewTab: false,
        resizeable: true,
        autofocus: true,
      }
      yasgui = new Yasgui(document.getElementById("yasgui_div"), yasgui_options);

    })

    function execute_example_query(btn_obj) {
      const query_path = btn_obj.getAttribute("data-query_path");
      // Either read data-query_label or the text from the link
      const query_name = btn_obj.getAttribute("data-query_label") || btn_obj.textContent;

      $.ajax({
        url: query_path,
        method: 'GET',
        success: function (data) {
          // Create the new tab
          const tab = yasgui.addTab(true, {name: query_name});
          // Set query and endpoint
          tab.setQuery(data);
          tab.setEndpoint(btn_obj.getAttribute("data-backend"));
          // Execute
          tab.query();
        },
        error: function (xhr, status, error) {
          console.error('Error loading query:', error);
        }
      });
    }
  </script>
  <style>
    .yasgui .autocompleteWrapper {
      display: none !important;
    }
  </style>
  <title></title>
</head>
<div class="container-fluid">
  <div class="row">
    <div class="col">
      <div class="btn-group">
        <button
          class="btn btn-secondary dropdown-toggle"
          type="button"
          id="dropdownMenuButton"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          data-bs-auto-close="true">
          Query Examples
        </button>
        <ul class="dropdown-menu" id="dynamic-dropdown-menu" aria-labelledby="dropdownMenuButton">
          {{ range .Page.Params.dropdown_items }}
          <li>
            <a onclick="execute_example_query(this);" class="dropdown-item" data-backend="{{ .backend }}"
               data-query_path="{{ .query_path }}">{{ .query_label }}</a>
          </li>
          {{ end }}
        </ul>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <div id="yasgui_div" style="width: 100%;"></div>
    </div>
  </div>
</div>
